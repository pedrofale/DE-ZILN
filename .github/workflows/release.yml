name: release

# Publishes to PyPI when a version tag is pushed.
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# Uses PyPI Trusted Publishing (OIDC), so there is no API token in this
# repository's secrets. That needs a one-time setup on PyPI -- see
# .github/workflows/README.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:      # lets you rehearse build+check without tagging

permissions:
  contents: read

jobs:
  build:
    name: build and check the distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      # setuptools reuses build/lib if it is present, so a tree with stale
      # artifacts ships modules that no longer exist in src/. That actually
      # happened on 2026-09-10: a wheel built after renaming ln_test.py and
      # scanpy_wrapper.py contained the old names alongside the new ones,
      # leaving `lntest.ln_test` importable and masking the rename.
      - name: Remove stale build artifacts
        run: rm -rf build dist src/*.egg-info

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution metadata
        run: twine check --strict dist/*

      # The tag is the release's only statement of what version this is, and
      # pyproject is the only statement the artifact carries. If they disagree,
      # the wrong number goes to PyPI permanently.
      - name: Tag must match the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag=$tag  pyproject=$pkg"
          [ "$tag" = "$pkg" ] || { echo "::error::tag v$tag does not match pyproject version $pkg"; exit 1; }

      # Guards the stale-build failure above, and anything else that would put
      # unintended files in the wheel.
      - name: Wheel contains exactly the package modules
        run: |
          python - <<'PY'
          import glob, zipfile, sys
          whl = glob.glob("dist/*.whl")[0]
          got = sorted(n for n in zipfile.ZipFile(whl).namelist() if n.endswith(".py"))
          want = ["lntest/__init__.py", "lntest/_ln_test.py", "lntest/_rank_genes_groups.py"]
          print("wheel:", whl)
          for n in got: print("  ", n)
          if got != want:
              print("::error::unexpected wheel contents", file=sys.stderr)
              print("expected:", want, file=sys.stderr)
              sys.exit(1)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The test extra pulls anndata and scanpy, whose own floors are 3.11
        # and 3.10. The package's claimed floor is checked separately below.
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q

  floor:
    name: the claimed requires-python floor actually imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read requires-python
        id: floor
        run: |
          v=$(python - <<'PY'
          import re, pathlib
          spec = re.search(r'requires-python\s*=\s*"([^"]+)"',
                           pathlib.Path("pyproject.toml").read_text()).group(1)
          print(re.search(r"(\d+\.\d+)", spec).group(1))
          PY
          )
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "floor is $v"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.floor.outputs.version }}

      # Install WITHOUT the test extra: a user on the floor version gets the
      # package and its runtime dependencies only.
      #
      # This job exists because the floor was wrong once. pyproject claimed
      # >=3.9 while a signature used `bool | None`, which is PEP 604 and
      # evaluates at definition time -- so the package was unimportable on the
      # version it advertised. The floor is now >=3.10, which is what the syntax
      # actually needs; this job is what keeps the two in step.
      - name: Install the package alone and use it
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python - <<'PY'
          import numpy as np
          from lntest import get_LN_lfcs, rank_genes_groups_ln, __version__
          rng = np.random.default_rng(0)
          Y = rng.poisson(5, size=(40, 6)).astype(float)
          X = rng.poisson(5, size=(40, 6)).astype(float)
          lfc, p = get_LN_lfcs(Y, X)
          assert np.all(np.isfinite(lfc)) and np.all(np.isfinite(p))
          print("imports and computes on the claimed floor:", __version__)
          PY

  publish:
    name: publish to PyPI
    needs: [build, test, floor]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ln-ttest
    permissions:
      id-token: write        # the OIDC token trusted publishing exchanges
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
