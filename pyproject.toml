[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lntest"
version = "0.1.0"
description = "LN's t-test: differential expression testing on an asymptotically unbiased log-fold-change estimator"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = ["single-cell", "differential-expression", "transcriptomics", "scanpy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
]

[project.urls]
Homepage = "https://github.com/pedrofale/lntest"
Source = "https://github.com/pedrofale/lntest"

[project.optional-dependencies]
# Needed only by lntest.scanpy_wrapper.rank_genes_groups_ln.
anndata = ["anndata>=0.9", "pandas>=1.5", "statsmodels>=0.13"]
test = ["lntest[anndata]", "pytest>=7"]

[tool.setuptools]
packages = ["lntest"]
package-dir = { "" = "src" }

[tool.pytest.ini_options]
testpaths = ["tests"]
